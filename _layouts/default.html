<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
</head>
<body>
    <div class="wrapper-container">
        <header class="masthead">
            <div class="site-info">
                <h1 class="site-name"><a href="{{ site.baseurl }}/">{{ site.title }}</a></h1>
                <p class="site-description">{{ site.description }}</p>
            </div>
            <nav class="main-nav">
                <a href="{{ site.baseurl }}/" {% if page.permalink == '/' %}class="active"{% endif %}>Home</a>
                <a href="{{ site.baseurl }}/cv" {% if page.permalink == '/cv/' %}class="active"{% endif %}>CV</a>
                <a href="{{ site.baseurl }}/research" {% if page.permalink == '/research/' %}class="active"{% endif %}>Research</a>
                <a href="{{ site.baseurl }}/teaching" {% if page.permalink == '/teaching/' %}class="active"{% endif %}>Teaching</a>
            </nav>
        </header>
        <main class="content">
            {{ content }}
        </main>
        <footer>
            <p>© {{ "now" | date: "%Y" }} {{ site.title }}</p>
        </footer>
    </div>
</body>
</html>
